# Configuración exclusiva del classpath de pruebas: no requiere MariaDB ni secretos.
spring.application.name=Ejercicio5MyAPIGestorTests
spring.datasource.url=jdbc:h2:mem:gestor-tests;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:linux123}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
